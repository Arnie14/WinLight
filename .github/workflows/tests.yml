# Lint and tests on GitHub's Windows machines for every push to a branch
# and every pull request, without building the app. Pushes to main and
# version tags are tested by release.yml, before it builds.
name: Tests

on:
  push:
    branches-ignore: [main]  # release.yml tests main before building
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch or pull request replaces a run still going.
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30  # the suite takes about 10 minutes; a hang mustn't hold a machine for 6 hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]" pytest-github-actions-annotate-failures

      - name: Lint
        run: python -m ruff check .

      - name: Test
        # Failures also appear as annotations on the run and the pull request.
        run: python -m pytest -q --tb=short -ra --junitxml=test-results.xml

      - name: Test counts
        if: always()
        shell: pwsh
        run: |
          if (Test-Path test-results.xml) {
            [xml]$results = Get-Content test-results.xml
            $suite = $results.testsuites.testsuite
            $passed = [int]$suite.tests - [int]$suite.failures - [int]$suite.errors - [int]$suite.skipped
            "### Tests: $passed passed, $($suite.failures) failed, $($suite.errors) errors, $($suite.skipped) skipped" >> $env:GITHUB_STEP_SUMMARY
          }
